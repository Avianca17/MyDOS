timeout: 10

/Boot LiveCD
    protocol: multiboot1
    path: boot():/mydos/mydoskernel.bin
    resolution: 1024x768x32

/Boot Installer
    protocol: multiboot1
    path: boot():/mydos/mydoskernel.bin
    resolution: 1024x768x32
    cmdline: installer
    module_path: boot():/mydos/install.tar
    module_string: mydos-install
